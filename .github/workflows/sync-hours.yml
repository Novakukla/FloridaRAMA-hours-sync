name: Sync Hours Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/sync-hours-data.mjs"
      - "scripts/prepare-hours-commit.mjs"
      - "special-hours-embed.html"
      - "hours-embed.html"
      - ".github/workflows/sync-hours.yml"
  schedule:
    # Refresh calendar changes hourly.
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-hours-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A queued run must start from the latest main, not the commit it was triggered on.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static data
        env:
          TZ: America/New_York
          PRIVATE_ICS_URL: ${{ secrets.PRIVATE_ICS_URL }}
        run: node scripts/sync-hours-data.mjs

      - name: Commit and push if changed
        run: |
          node scripts/prepare-hours-commit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hours.json data/special-hours.json data/open-windows.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync calendar hours data"
          git push
